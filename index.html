<!DOCTYPE html>
<html lang+"pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo - O jeito de aprender mais popular do mundo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <a href="#" class="logo">

    <main>

                <div class="botoes">

            </div>

        <section class="idiomas">

            <a href="#">INGLÊS</a>
